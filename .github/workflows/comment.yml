# Puts the report of "Check plugins" under the pull request. It runs from main with a token that may comment, and it does not check out or run anything from the
# pull request: it only reads a text file from the artifact.
name: Comment on pull request
on:
  workflow_run:
    workflows: ["Check plugins"]
    types: [completed]
permissions:
  pull-requests: write
  actions: read
jobs:
  comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: report
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const number = parseInt(fs.readFileSync('pr-number.txt', 'utf8').trim(), 10);
            if (!Number.isInteger(number)) return;
            const body = fs.readFileSync('report.md', 'utf8').slice(0, 60000);
            const marker = '<!-- lostos-plugin-check -->';
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number });
            const mine = comments.find(c => c.body.startsWith(marker));
            const text = marker + '\n' + body;
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: text });
            else await github.rest.issues.createComment({ owner, repo, issue_number: number, body: text });
